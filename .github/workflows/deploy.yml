name: Deploy Horas Excelia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 tools/kairo/test_home_status.py
      - run: python3 tools/kairo/test_hours.py
      - run: python3 tools/kairo/test_hours_jobs.py
      - run: python3 tools/kairo/test_outlook_auth.py
      - run: python3 tools/kairo/test_bridge.py
      - run: python3 tools/kairo/test_month_review.py
      - run: python3 tools/kairo/test_project_periods.py
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: gestify-dist
          path: dist
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  browser:
    needs: checks
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      GESTIFY_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: gestify-dist
          path: dist
      - name: Check preinstalled Chrome
        run: google-chrome --version
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/4 --workers=1

  deploy:
    needs: [checks, browser]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: gestify-dist
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
