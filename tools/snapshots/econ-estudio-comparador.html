<div class="sy-section">
<div class="sy-section-title">Escenarios</div>
<div class="econ-comp-scenarios">
<div class="econ-scenario-card" style="--sc-tone:#34d399">
<div class="econ-sc-header">
<span class="econ-sc-badge" aria-label="Escenario A">A</span>
<div class="econ-sc-types" role="group" aria-label="Tipo de ingreso del escenario A">
<button type="button" class="econ-sc-type" data-sci="0" data-type="salary" aria-pressed="false">Nómina</button>
<button type="button" class="econ-sc-type active" data-sci="0" data-type="daily" aria-pressed="true">€/día</button>
<button type="button" class="econ-sc-type" data-sci="0" data-type="hourlyReal" aria-pressed="false">€/h real</button>
<button type="button" class="econ-sc-type" data-sci="0" data-type="hourly8h" aria-pressed="false">€/h 8h</button>
</div>
</div>
<div class="econ-sc-row">
<label class="econ-sc-amount">
<input class="econ-sc-input" data-sci="0" type="number" inputmode="decimal" min="0" step="1" placeholder="0" value="" aria-label="Importe del escenario A en €/día">
<span class="econ-sc-unit">€/día</span>
</label>
<div class="econ-sc-tools">
<button type="button" class="econ-sc-reorder" data-sci="0" data-dir="up" aria-label="Subir escenario A" disabled>&#9650;</button>
<button type="button" class="econ-sc-reorder" data-sci="0" data-dir="down" aria-label="Bajar escenario A">&#9660;</button>
</div>
</div>
</div>
<div class="econ-scenario-card" style="--sc-tone:#6c8cff">
<div class="econ-sc-header">
<span class="econ-sc-badge" aria-label="Escenario B">B</span>
<div class="econ-sc-types" role="group" aria-label="Tipo de ingreso del escenario B">
<button type="button" class="econ-sc-type" data-sci="1" data-type="salary" aria-pressed="false">Nómina</button>
<button type="button" class="econ-sc-type active" data-sci="1" data-type="daily" aria-pressed="true">€/día</button>
<button type="button" class="econ-sc-type" data-sci="1" data-type="hourlyReal" aria-pressed="false">€/h real</button>
<button type="button" class="econ-sc-type" data-sci="1" data-type="hourly8h" aria-pressed="false">€/h 8h</button>
</div>
</div>
<div class="econ-sc-row">
<label class="econ-sc-amount">
<input class="econ-sc-input" data-sci="1" type="number" inputmode="decimal" min="0" step="1" placeholder="0" value="" aria-label="Importe del escenario B en €/día">
<span class="econ-sc-unit">€/día</span>
</label>
<div class="econ-sc-tools">
<button type="button" class="econ-sc-reorder" data-sci="1" data-dir="up" aria-label="Subir escenario B">&#9650;</button>
<button type="button" class="econ-sc-reorder" data-sci="1" data-dir="down" aria-label="Bajar escenario B" disabled>&#9660;</button>
</div>
</div>
</div>
<button class="econ-add-sc-btn" id="ecAddScenario">+ A&#241;adir escenario</button>
</div>
<button class="econ-calc-btn" id="ecCompCalcular">Calcular comparativa</button>
</div>
