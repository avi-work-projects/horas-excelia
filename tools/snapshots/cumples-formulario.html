<div class="bd-form-overlay" id="bdFormOv">
<div class="bd-form-sheet">
<div class="bd-form-handle">
</div>
<header class="bd-panel-header">
<button class="sy-back" id="bdFClose">&#8592;</button>
<div style="flex:1;font-size:.9rem;font-weight:600;text-align:center">Editar cumpleaños</div>
<button class="ev-btn danger" id="bdFDel" style="flex:none;padding:6px 12px;font-size:.75rem">Eliminar</button>
</header>
<div class="bd-panel-body">
<div class="ev-field">
<label>Nombre</label>
<div class="bday-name-field">
<input class="ev-input" id="bdFName" type="text" maxlength="60" placeholder="Nombre completo" value="ana pruebas">
<img class="bday-name-vip" id="bdFNameVip" src="./VIP.png" alt="VIP" style="visibility:visible" aria-hidden="false">
</div>
</div>
<div class="ev-field ev-date-row">
<div>
<label>Día</label>
<input class="ev-input" id="bdFDay" type="number" min="1" max="31" placeholder="1-31" value="26">
</div>
<div>
<label>Mes</label>
<select class="ev-input" id="bdFMonth">
<option value="1">Enero</option>
<option value="2">Febrero</option>
<option value="3">Marzo</option>
<option value="4">Abril</option>
<option value="5">Mayo</option>
<option value="6">Junio</option>
<option value="7">Julio</option>
<option value="8" selected>Agosto</option>
<option value="9">Septiembre</option>
<option value="10">Octubre</option>
<option value="11">Noviembre</option>
<option value="12">Diciembre</option>
</select>
</div>
</div>
<label class="bday-person-vip">
<input type="checkbox" id="bdFVip" aria-label="VIP" checked>
<img src="./VIP.png" alt="" aria-hidden="true">
</label>
<section class="bday-detail-groups">
<div class="bday-category-heading">
<h3>Categorías</h3>
<button type="button" class="ev-btn bday-category-button" id="bdCategories" data-groups="[]">Cambiar <span aria-hidden="true">›</span>
</button>
</div>
<div class="bday-person-groups" id="bdPersonGroups">
<span class="bday-no-category">Sin categoría</span>
</div>
</section>
</div>
<footer class="bd-panel-footer">
<button class="ev-btn primary" id="bdFSave">Guardar</button>
</footer>
</div>
</div>
