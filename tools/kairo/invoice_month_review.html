<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Factura · Kairo</title><!--KAIRO_HEAD--></head>
<body class="k-ui"><!--KAIRO_HEADER--><main class="k-main">
<div class="k-eye">Facturación · <span id="progress"></span></div><h1><!--TITLE--></h1>
<!--KAIRO_STEPS--><!--CONTENT--><p id="result" role="status"></p></main>
<dialog id="confirm"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="k-action-list"><button class="k-primary" id="confirmGo">Confirmar</button><button id="close">Volver a revisar</button></div></dialog>
<script>
const boot=/*BOOT*/;
const el=id=>document.getElementById(id);
let busy=false;
const steps=['borrador','factura','correo','aprobar','archivo'];
function showStep(number){
  document.querySelectorAll('[data-panel]').forEach(panel=>panel.hidden=Number(panel.dataset.panel)!==number);
  document.querySelectorAll('[data-step]').forEach(button=>{
    if(Number(button.dataset.step)===number)button.setAttribute('aria-current','step');
    else button.removeAttribute('aria-current');
  });
  el('progress').textContent='Paso '+number+' de '+steps.length;
}
function selectStep(number){
  showStep(number);
  history.replaceState(null,'','#'+steps[number-1]);
  window.scrollTo(0,0);
}
function showLocation(){
  const requested=steps.indexOf(location.hash.slice(1))+1;
  showStep(boot.hasPlan&&requested?requested:boot.initial);
}
showLocation();window.addEventListener('hashchange',showLocation);
document.querySelectorAll('[data-step],[data-go]').forEach(button=>{
  button.onclick=()=>selectStep(Number(button.dataset.step||button.dataset.go));
});
const dialog=el('confirm');
el('close').onclick=()=>dialog.close();
document.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>{
  const action=button.dataset.action;
  el('confirmTitle').textContent=button.textContent;
  el('confirmText').textContent=action==='approve'?boot.period+' · Se autorizarán la emisión y el envío en la fecha indicada.':boot.period+' · '+(button.textContent.includes('correo')?'Se cancelará únicamente el correo pendiente.':'Se cancelará esta programación.');
  el('confirmGo').onclick=async()=>{
    if(busy)return;
    busy=true;dialog.close();
    document.querySelectorAll('[data-action]').forEach(b=>b.disabled=true);
    const result=el('result');result.textContent='Guardando…';
    try{
      const response=await fetch('/facturas/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF':boot.csrf},body:JSON.stringify({hash:boot.hash,planId:boot.planId})});
      const data=await response.json();
      if(!response.ok)throw Error(data.message||'Operación sin confirmar');
      location.reload();
    }catch(error){
      result.textContent=error.message;busy=false;
      document.querySelectorAll('[data-action]').forEach(b=>b.disabled=false);
    }
  };
  dialog.showModal();
});
</script></body></html>
