<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Programación · Kairo</title><!--KAIRO_HEAD-->
<style>
.calendar-header{display:flex;align-items:center;justify-content:space-between;gap:8px}.calendar-header h2{margin:0}.calendar-header h2::first-letter{text-transform:uppercase}
.k-ui .calendar-header button{font-size:22px;width:40px;padding:0}
.hours-calendar table{width:100%;table-layout:fixed;border-spacing:2px;text-align:center;margin-top:12px}.hours-calendar th{font-size:10px;color:var(--k-muted);padding:4px 0}.hours-calendar th:first-child{width:23px}
.calendar-day{height:42px;border:1px solid transparent;border-radius:8px;background:var(--k-bg);color:var(--text,#f2f5eb);font-size:13px;font-variant-numeric:tabular-nums}.day-number{display:block;font-weight:650}.day-type{font-size:9px}.calendar-day.outside{opacity:.42}
.included .week-number{color:var(--k-accent)}.included .calendar-day:not(.vacaciones,.festivo,.ausencia,.invoice-delivery){background-color:#20372d}.calendar-day.delivery{border-color:var(--k-accent)}.calendar-day.planned{border-style:dashed}
.calendar-day{padding:0;vertical-align:middle}.day-head,.day-marks{display:flex;align-items:center;justify-content:center;gap:2px}.day-head{height:18px;line-height:1}.day-marks{height:16px;line-height:1}
.envelope,.invoice-marker{display:block;flex:none;width:15px;height:15px;color:var(--k-accent)}.invoice-marker{width:18px;height:18px;color:#bd497a}
.calendar-day.invoice-delivery{background-image:linear-gradient(#60394d,#60394d);border-bottom:3px solid #efa6c6;box-shadow:none}
.calendar-day.invoice-delivery:is(.vacaciones,.festivo,.ausencia){background-image:none}
html:has(body.k-agenda){scrollbar-gutter:stable}.k-filters .filter-icon{width:19px;height:19px;flex:none}.k-filters [for=showInvoices] .filter-icon{color:#cb5789}
.k-agenda .invoice-manage summary{display:grid;cursor:pointer;padding:0}.k-agenda .invoice-manage{border:0}
.k-agenda .invoice-manage summary .k-state:after{content:"";display:inline-block;width:6px;height:6px;margin:0 2px 3px 6px;border-right:1.5px solid;border-bottom:1.5px solid;transform:rotate(45deg)}
.k-agenda .invoice-manage[open] summary .k-state:after{transform:rotate(225deg);margin-bottom:0}
.hours-calendar .vacaciones{--day-color:#f0cb83}.hours-calendar .festivo{--day-color:#ffaaa4}.hours-calendar .ausencia{--day-color:#e4c0ee}.calendar-day:is(.vacaciones,.festivo,.ausencia){background:color-mix(in srgb,var(--day-color) 13%,var(--k-bg));color:var(--day-color)}
.calendar-legend{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px;font-size:10px;color:var(--k-muted)}.calendar-legend span{color:var(--day-color)}
.calendar-note,.k-ui #message,.k-ui #notice,.k-ui #intro{font-size:12px}
.k-filters{display:flex;gap:8px;margin:0 0 12px}.k-filters label{display:inline-flex;align-items:center;cursor:pointer;gap:7px;padding:7px 14px;min-height:38px;border:1px solid var(--k-line);border-radius:20px;color:var(--k-muted);font-size:13px;font-weight:650}.k-filters label:has(:checked){background:#294235;color:var(--k-accent);border-color:#526e55}.k-filters input{accent-color:var(--k-accent);width:15px;height:15px;margin:0}
.week header,.resolved-week,.k-schedule-row,.k-section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.resolved-week,.k-schedule-row{padding:9px 0;border-bottom:1px solid var(--k-line);font-size:13px}.k-schedule-row:last-child,.resolved-week:last-child{border:0}
.k-state{font-size:12px;font-weight:650;white-space:nowrap;color:var(--k-muted)}.k-state[data-state=scheduled],.k-state[data-state=sent]{color:var(--k-accent)}.k-schedule-row small{display:block;color:var(--k-muted);font-size:11px}.k-ui .k-section-heading h2{font-size:15px;margin:0}
.week .state,.date,#simulation{font-size:13px}.week .state,.date{color:var(--k-accent)}.week label{display:flex;align-items:center;gap:8px;font-size:13px}.week input{accent-color:var(--k-accent)}.week details{margin-top:8px}.buttons{display:flex;flex-wrap:wrap;gap:8px}.buttons button{flex:1}.recipients,pre,#message{overflow-wrap:anywhere}
#calendar{touch-action:pan-y}.k-ui .k-main:has(#filters:not([hidden])) #weeks{margin-bottom:8px}.k-sync{font-size:11px;color:var(--k-muted)}.k-ui .k-sync button{font-size:12px;min-height:36px}
.k-agenda .k-main{padding-top:13px}.k-agenda .k-main>h1{margin-bottom:10px}.k-agenda .k-eye{display:none}
.k-agenda .hours-calendar,.k-agenda #weeks,.k-agenda #invoiceSchedule{padding:11px 13px;margin:8px 0}
.k-agenda .hours-calendar table{margin-top:5px}.k-agenda .calendar-day{height:43px}.k-agenda .calendar-legend{margin-top:6px}
.k-agenda .k-schedule-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;padding:5px 0;min-height:29px}.k-week-number{color:var(--k-muted);font-size:11px;font-weight:700}
.k-agenda .k-card h2{font-size:15px;margin:0 0 4px}.k-agenda #invoiceSchedule .k-schedule-row{grid-template-columns:auto 1fr auto}.k-agenda #invoiceSchedule h2{margin:0}.k-agenda .k-sync button{min-height:32px}
@media(max-width:600px){html:has(body.k-agenda){scrollbar-gutter:auto;scrollbar-width:none}}
</style></head><body class="k-ui"><!--KAIRO_HEADER--><main class="k-main">
<div class="k-eye">Agenda <span class="badge"></span></div><h1 id="title">Revisar programación</h1><p id="intro"></p>
<div class="k-filters" id="filters" hidden role="group" aria-label="Mostrar en el calendario"><label for="showMail"><input type="checkbox" id="showMail" checked><svg class="filter-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#dispatch-mail"/></svg>Correos</label><label for="showInvoices"><input type="checkbox" id="showInvoices" checked><svg class="filter-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#dispatch-invoice"/></svg>Facturas</label></div>
<p id="message" role="status">Abre esta revisión desde Gestify.</p>
<section class="summary" id="summary" hidden></section><section class="hours-calendar" id="calendar" aria-label="Calendario de programación" hidden></section>
<section class="k-card" id="invoiceSchedule" hidden aria-label="Programación de factura"></section><div id="weeks"></div><div id="calendarSync" class="k-sync"></div>
<details class="resolved" id="resolved" hidden><summary id="resolvedTitle">Semanas enviadas y programadas</summary><div id="resolvedWeeks"></div></details>
<details class="recipients" id="recipients" hidden><summary>Destinatarios</summary><div id="recipientsBody"></div></details>
<section id="simulation" role="status" hidden></section>
<footer class="actions"><p id="notice"></p><div class="buttons"><button id="simulate" class="primary" disabled>Simular programación</button><button id="refresh" hidden>Actualizar</button></div></footer>
</main><script>const hoursBridgeConfig=/*HOURS_CONFIG*/;</script><script>/*HOURS_SCRIPT*/</script></body></html>
