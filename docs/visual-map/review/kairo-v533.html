<nav><a href="../index.html">Mapa de Gestify</a><a href="kairo-v531.html">Revisión anterior</a></nav><h1>Agenda de envíos</h1><p>Ejemplos con datos ficticios. Pulsa una imagen para ampliarla.</p><div class="cases"><figure id="agenda"><figcaption><b>Correo y factura el mismo día</b><span>El viernes 19 coinciden ambos envíos. El sobre blanco no cambia el fondo de los demás días.</span></figcaption><a href="evidence/kairo-v533/agenda.png"><img loading="lazy" alt="Correo y factura el mismo día" src="evidence/kairo-v533/agenda.png"></a></figure><figure id="historico"><figcaption><b>Un mes sin comprobar</b><span>El viernes 18 es festivo y el jueves 17 son vacaciones: el sobre subrayado señala el miércoles 16. El estado sigue siendo «Sin comprobar».</span></figcaption><a href="evidence/kairo-v533/historico.png"><img loading="lazy" alt="Un mes sin comprobar" src="evidence/kairo-v533/historico.png"></a></figure><figure id="home"><figcaption><b>Acceso desde Home</b><span>«Ver envíos», junto a «Exportar Horas», abre la misma agenda.</span></figcaption><a href="evidence/kairo-v533/home.png"><img loading="lazy" alt="Acceso desde Home" src="evidence/kairo-v533/home.png"></a></figure></div></main></body></html>
